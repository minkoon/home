<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>어린 왕자의 작은 지구</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;background:#f7b58a;color:#3b2a20}
[hidden]{display:none!important}

/* 장면 영역: 패널이 열리면 좌측으로 줄어든다 */
#stage{position:fixed;inset:0;width:100%;overflow:hidden;transition:width .6s cubic-bezier(.65,0,.35,1)}
body.panel-open #stage{width:62%}
#scene{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
#scene:active{cursor:grabbing}

.hud{position:absolute;top:20px;left:22px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.35);pointer-events:none;z-index:5}
.hud h1{font-size:clamp(16px,2.2vw,24px);font-weight:700}
.hud p{font-size:13px;opacity:.92;margin-top:4px}

.controls{position:absolute;left:18px;bottom:18px;display:flex;gap:8px;flex-wrap:wrap;z-index:5}

.pad{position:absolute;right:18px;bottom:18px;display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,42px);gap:6px;z-index:5;transition:opacity .3s}
.pad button{padding:0;width:42px;height:42px;font-size:14px;user-select:none;touch-action:none}
.pad [data-key="ArrowUp"]{grid-column:2;grid-row:1}
.pad [data-key="ArrowLeft"]{grid-column:1;grid-row:2}
.pad [data-key="ArrowDown"]{grid-column:2;grid-row:2}
.pad [data-key="ArrowRight"]{grid-column:3;grid-row:2}
body.panel-open .pad{opacity:0;pointer-events:none}

.ui-btn{border:0;border-radius:999px;padding:9px 14px;background:rgba(255,255,255,.88);color:#3b2a20;font-family:inherit;font-size:13px;font-weight:600;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.15);transition:transform .15s,background .2s,color .2s}
.ui-btn:hover{transform:translateY(-1px)}
.ui-btn.active{background:#ff8a5b;color:#fff}

.menu{position:fixed;top:18px;right:18px;display:flex;gap:8px;z-index:20;transition:opacity .3s}
body.panel-open .menu{opacity:0;pointer-events:none}

/* 우측 패널 */
.panel{position:fixed;top:0;right:0;height:100%;width:38%;background:rgba(255,252,248,.97);transform:translateX(100%);transition:transform .6s cubic-bezier(.65,0,.35,1);display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.2);z-index:30}
body.panel-open .panel{transform:translateX(0)}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid #f2dfcf}
.tabs{display:flex;gap:6px}
.tab{border:0;background:#fbeee4;color:#8a5a3c;padding:8px 14px;border-radius:999px;font-weight:600;cursor:pointer;font-family:inherit}
.tab.active{background:#ff8a5b;color:#fff}
.close{border:0;background:none;font-size:20px;cursor:pointer;color:#8a5a3c}
.panel-body{flex:1;overflow-y:auto;padding:18px}

.form{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;padding:14px;background:#fff4ea;border-radius:16px}
.form input,.form textarea{font:inherit;padding:10px 12px;border:1px solid #f0d5c0;border-radius:10px;background:#fff;color:inherit}
.form textarea{min-height:90px;resize:vertical}
.form button[type=submit]{background:#ff8a5b;color:#fff;border:0;padding:11px;border-radius:10px;font-weight:700;cursor:pointer;font-family:inherit}
.file{display:inline-block;cursor:pointer;color:#8a5a3c;font-size:14px;font-weight:600}
.file input{display:none}
.preview{max-width:100%;border-radius:12px}

.list{list-style:none;display:flex;flex-direction:column;gap:12px}
.item{background:#fff;border:1px solid #f3e2d4;border-radius:14px;padding:14px}
.item h3{font-size:16px;margin-bottom:4px;word-break:break-word}
.item .meta{font-size:12px;color:#a58874;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.item p{white-space:pre-wrap;line-height:1.6;font-size:14px;word-break:break-word}
.item img{width:100%;border-radius:10px;margin:8px 0}
.del{border:0;background:#fbeee4;color:#b5583a;border-radius:8px;padding:4px 8px;font-size:12px;cursor:pointer;font-family:inherit}
.empty{text-align:center;color:#a58874;padding:30px 0}

/* 반응형 */
@media (max-width:768px){
  body.panel-open #stage{width:42%}
  .panel{width:58%}
  .hud h1{font-size:15px}
  .hud p{display:none}
  .controls{left:10px;bottom:10px}
  .ui-btn{padding:8px 11px;font-size:12px}
  .pad{right:10px;bottom:10px;grid-template-columns:repeat(3,36px);grid-template-rows:repeat(2,36px)}
  .pad button{width:36px;height:36px}
  .menu{top:12px;right:12px}
}
</style>
</head>
<body>

<!-- 3D 장면 영역 (패널이 열리면 좌측으로 줄어듦) -->
<div id="stage">
  <canvas id="scene" aria-label="바다 위의 어린 왕자 지구"></canvas>

  <div class="hud">
    <h1>✨ 어린 왕자의 작은 지구</h1>
    <p>방향키(또는 화면 버튼)로 이동 · 지구를 드래그해서 회전</p>
  </div>

  <div class="controls">
    <button class="ui-btn" id="btnSound">🔈 바다 소리 켜기</button>
    <button class="ui-btn active" id="btnAI">🤖 AI 모드 켜짐</button>
  </div>

  <div class="pad">
    <button class="ui-btn" data-key="ArrowUp">▲</button>
    <button class="ui-btn" data-key="ArrowLeft">◀</button>
    <button class="ui-btn" data-key="ArrowDown">▼</button>
    <button class="ui-btn" data-key="ArrowRight">▶</button>
  </div>
</div>

<!-- 상단 메뉴 -->
<nav class="menu">
  <button class="ui-btn" data-tab="board">📋 게시판</button>
  <button class="ui-btn" data-tab="guestbook">✍️ 방명록</button>
</nav>

<!-- 우측 패널 -->
<aside class="panel" id="panel">
  <header class="panel-head">
    <div class="tabs">
      <button class="tab" data-tab="board">게시판</button>
      <button class="tab" data-tab="guestbook">방명록</button>
    </div>
    <button class="close" id="btnClose" aria-label="닫기">✕</button>
  </header>

  <div class="panel-body">
    <!-- 게시판 -->
    <section id="view-board" class="view">
      <form id="boardForm" class="form">
        <input id="boardTitle" placeholder="제목" maxlength="60" required />
        <textarea id="boardText" placeholder="내용을 입력하세요" maxlength="1000" required></textarea>
        <label class="file">
          📷 사진 첨부
          <input type="file" id="boardPhoto" accept="image/*" />
        </label>
        <img id="boardPreview" class="preview" alt="미리보기" hidden />
        <button type="submit">글 올리기</button>
      </form>
      <ul id="boardList" class="list"></ul>
    </section>

    <!-- 방명록 -->
    <section id="view-guestbook" class="view" hidden>
      <form id="guestForm" class="form">
        <input id="guestName" placeholder="이름" maxlength="20" required />
        <textarea id="guestText" placeholder="방명록을 남겨 주세요" maxlength="300" required></textarea>
        <button type="submit">남기기</button>
      </form>
      <ul id="guestList" class="list"></ul>
    </section>
  </div>
</aside>

<!-- Three.js (고정 버전) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
/* 파도 소리: 파일 없이 Web Audio로 생성 */
(function () {
  const btn = document.getElementById('btnSound');
  let ctx = null, master = null, on = false;

  function makeNoise(seconds, type) {
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    const fade = Math.floor(ctx.sampleRate * 0.5);
    let last = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      if (type === 'brown') {
        last = (last + 0.02 * w) / 1.02;
        d[i] = last * 3.2;
      } else {
        d[i] = w * 0.25;
      }
      d[i] *= Math.min(1, i / fade, (len - i) / fade);
    }
    return buf;
  }

  function build() {
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0;
    master.connect(ctx.destination);

    const waveSrc = ctx.createBufferSource();
    waveSrc.buffer = makeNoise(6, 'brown');
    waveSrc.loop = true;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 650;
    lp.Q.value = 0.8;
    const waveGain = ctx.createGain();
    waveGain.gain.value = 0.5;
    waveSrc.connect(lp).connect(waveGain).connect(master);

    const lfo = ctx.createOscillator();
    lfo.frequency.value = 0.085;
    const lfoAmp = ctx.createGain();
    lfoAmp.gain.value = 0.3;
    const lfoFreq = ctx.createGain();
    lfoFreq.gain.value = 350;
    const lfoInv = ctx.createGain();
    lfoInv.gain.value = -0.04;
    lfo.connect(lfoAmp).connect(waveGain.gain);
    lfo.connect(lfoFreq).connect(lp.frequency);

    const hissSrc = ctx.createBufferSource();
    hissSrc.buffer = makeNoise(4, 'white');
    hissSrc.loop = true;
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 1800;
    const hissGain = ctx.createGain();
    hissGain.gain.value = 0.06;
    lfo.connect(lfoInv).connect(hissGain.gain);
    hissSrc.connect(hp).connect(hissGain).connect(master);

    lfo.start();
    waveSrc.start();
    hissSrc.start();
  }

  function toggle() {
    if (!ctx) build();
    if (ctx.state === 'suspended') ctx.resume();
    on = !on;
    const now = ctx.currentTime;
    master.gain.cancelScheduledValues(now);
    master.gain.setValueAtTime(master.gain.value, now);
    master.gain.linearRampToValueAtTime(on ? 0.6 : 0, now + 1.5);
    btn.textContent = on ? '🔊 바다 소리 끄기' : '🔈 바다 소리 켜기';
    btn.classList.toggle('active', on);
  }

  btn.addEventListener('click', toggle);
})();
</script>

<script>
/* 우측 패널(게시판/방명록), 사진 업로드, 저장 */
(function () {
  const $ = id => document.getElementById(id);
  const body = document.body;
  const views = { board: $('view-board'), guestbook: $('view-guestbook') };
  const KEY = { board: 'little-prince-board-v1', guest: 'little-prince-guest-v1' };

  /* ---------- 저장소 (브라우저 localStorage) ---------- */
  const read = k => { try { return JSON.parse(localStorage.getItem(k)) || []; } catch { return []; } };
  const write = (k, data) => {
    try { localStorage.setItem(k, JSON.stringify(data)); return true; }
    catch { alert('저장 공간이 가득 찼어요. 사진 수를 줄이거나 더 작은 사진을 올려 주세요.'); return false; }
  };
  const fmt = ts => new Date(ts).toLocaleString('ko-KR', { dateStyle: 'medium', timeStyle: 'short' });
  const h = (tag, props = {}, ...children) => {
    const el = document.createElement(tag);
    Object.assign(el, props);
    children.forEach(c => el.append(c));
    return el;
  };

  /* ---------- 패널 열고 닫기 ---------- */
  function openPanel(tab) {
    body.classList.add('panel-open');
    Object.entries(views).forEach(([k, v]) => { v.hidden = k !== tab; });
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    tab === 'board' ? renderBoard() : renderGuest();
  }
  document.querySelectorAll('[data-tab]').forEach(btn =>
    btn.addEventListener('click', () => openPanel(btn.dataset.tab))
  );
  $('btnClose').addEventListener('click', () => body.classList.remove('panel-open'));

  /* ---------- 사진 리사이즈 (용량 절약) ---------- */
  function resizeImage(file, maxSide = 900, quality = 0.75) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const s = Math.min(1, maxSide / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * s);
          c.height = Math.round(img.height * s);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  /* ---------- 게시판 ---------- */
  let pendingPhoto = null;
  const preview = $('boardPreview');

  $('boardPhoto').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    pendingPhoto = await resizeImage(file);
    preview.src = pendingPhoto;
    preview.hidden = false;
  });

  $('boardForm').addEventListener('submit', e => {
    e.preventDefault();
    const title = $('boardTitle').value.trim();
    const text = $('boardText').value.trim();
    if (!title || !text) return;
    const posts = read(KEY.board);
    posts.unshift({ id: Date.now(), title, text, photo: pendingPhoto, time: Date.now() });
    if (write(KEY.board, posts)) {
      e.target.reset();
      pendingPhoto = null;
      preview.hidden = true;
      renderBoard();
    }
  });

  function renderBoard() {
    const list = $('boardList');
    const posts = read(KEY.board);
    list.replaceChildren();
    if (!posts.length) {
      list.append(h('li', { className: 'empty', textContent: '아직 글이 없어요. 첫 글을 남겨 보세요 🌅' }));
      return;
    }
    posts.forEach(p => {
      const li = h('li', { className: 'item' },
        h('h3', { textContent: p.title }),
        h('div', { className: 'meta' },
          h('span', { textContent: fmt(p.time) }),
          h('button', { className: 'del', textContent: '삭제', onclick: () => removeBoard(p.id) })
        ),
        h('p', { textContent: p.text })
      );
      if (p.photo) {
        li.insertBefore(h('img', { src: p.photo, alt: p.title, loading: 'lazy' }), li.querySelector('p'));
      }
      list.append(li);
    });
  }

  function removeBoard(id) {
    if (!confirm('이 글을 삭제할까요?')) return;
    write(KEY.board, read(KEY.board).filter(p => p.id !== id));
    renderBoard();
  }

  /* ---------- 방명록 ---------- */
  if (!localStorage.getItem(KEY.guest)) {
    write(KEY.guest, [{ id: 1, name: '어린 왕자', text: '지구에 와 줘서 고마워요. 여기에 인사를 남겨 주세요!', time: Date.now() }]);
  }

  $('guestForm').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('guestName').value.trim();
    const text = $('guestText').value.trim();
    if (!name || !text) return;
    const entries = read(KEY.guest);
    entries.unshift({ id: Date.now(), name, text, time: Date.now() });
    if (write(KEY.guest, entries)) {
      e.target.reset();
      renderGuest();
    }
  });

  function renderGuest() {
    const list = $('guestList');
    const entries = read(KEY.guest);
    list.replaceChildren();
    entries.forEach(g => {
      list.append(h('li', { className: 'item' },
        h('h3', { textContent: g.name }),
        h('div', { className: 'meta' },
          h('span', { textContent: fmt(g.time) }),
          h('button', { className: 'del', textContent: '삭제', onclick: () => removeGuest(g.id) })
        ),
        h('p', { textContent: g.text })
      ));
    });
  }

  function removeGuest(id) {
    if (!confirm('이 방명록을 삭제할까요?')) return;
    write(KEY.guest, read(KEY.guest).filter(g => g.id !== id));
    renderGuest();
  }
})();
</script>

<script>
/* 어린 왕자의 지구 - Three.js 장면 */
(function () {
  const R = 2.2;
  const SUN_DIR = new THREE.Vector3(-0.35, 0.14, -1).normalize();
  const canvas = document.getElementById('scene');
  const stage = document.getElementById('stage');

  /* ---------- 렌더러 / 카메라 ---------- */
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 500);
  const lookTarget = new THREE.Vector3(0, 3.6, -3);

  /* ---------- 하늘 (일출) ---------- */
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: { sunDir: { value: SUN_DIR } },
    vertexShader: `
      varying vec3 vDir;
      void main(){
        vDir = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
      }`,
    fragmentShader: `
      uniform vec3 sunDir;
      varying vec3 vDir;
      void main(){
        vec3 d = normalize(vDir);
        float h = d.y;
        vec3 horizon = vec3(1.0,0.62,0.42);
        vec3 warm    = vec3(1.0,0.84,0.66);
        vec3 zenith  = vec3(0.32,0.5,0.82);
        vec3 col = mix(horizon, warm, smoothstep(-0.02,0.08,h));
        col = mix(col, zenith, smoothstep(0.08,0.6,h));
        float s = max(dot(d, normalize(sunDir)), 0.0);
        col += vec3(1.0,0.7,0.4) * pow(s,6.0) * 0.55;
        col += vec3(1.0,0.95,0.8) * smoothstep(0.9993,0.9998,s);
        gl_FragColor = vec4(col,1.0);
      }`
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(200, 32, 16), skyMat);
  sky.renderOrder = -2;
  scene.add(sky);

  /* ---------- 바다 + 모래사장 ---------- */
  const groundMat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uCam: { value: new THREE.Vector3() },
      sunDir: { value: SUN_DIR }
    },
    vertexShader: `
      varying vec3 vW;
      void main(){
        vec4 w = modelMatrix * vec4(position,1.0);
        vW = w.xyz;
        gl_Position = projectionMatrix * viewMatrix * w;
      }`,
    fragmentShader: `
      uniform float uTime;
      uniform vec3 sunDir;
      uniform vec3 uCam;
      varying vec3 vW;

      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
      float vnoise(vec2 p){
        vec2 i = floor(p), f = fract(p);
        f = f*f*(3.0-2.0*f);
        float a = hash(i), b = hash(i+vec2(1.0,0.0));
        float c = hash(i+vec2(0.0,1.0)), d = hash(i+vec2(1.0,1.0));
        return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
      }
      float waves(vec2 p, float t){
        return sin(p.x*0.9 + t*1.1)*0.45
             + sin(p.y*1.4 - t*0.8 + p.x*0.4)*0.35
             + sin((p.x*0.7 + p.y)*2.3 + t*1.9)*0.12
             + vnoise(p*1.3 + vec2(t*0.3,0.0))*0.3;
      }

      void main(){
        vec2 p = vW.xz;
        float t = uTime;

        float s = 0.5 + 0.5*sin(t*0.5 - 1.2);
        float runup = s*s*(3.0-2.0*s);
        float shore = -1.0 + runup*1.5
                    + sin(p.x*0.25 + t*0.25)*0.25
                    + vnoise(vec2(p.x*0.35, t*0.25))*0.35;
        float dz = p.y - shore;

        float e = 0.06;
        float h0 = waves(p,t);
        float hx = waves(p+vec2(e,0.0),t);
        float hz = waves(p+vec2(0.0,e),t);
        vec3 N = normalize(vec3((h0-hx)/e*0.5, 1.0, (h0-hz)/e*0.5));
        vec3 V = normalize(uCam - vW);
        vec3 R = reflect(-V, N);
        float fres = pow(1.0 - max(dot(N,V),0.0), 3.0);

        vec3 deep = vec3(0.03,0.2,0.36);
        vec3 shallow = vec3(0.1,0.48,0.56);
        vec3 water = mix(deep, shallow, smoothstep(-6.0,0.0,dz));
        vec3 skyRefl = mix(vec3(1.0,0.6,0.42), vec3(0.5,0.62,0.86), clamp(R.y*2.0,0.0,1.0));
        water = mix(water, skyRefl, clamp(fres*1.2+0.1,0.0,1.0));
        float sunSpec = max(dot(R, normalize(sunDir)), 0.0);
        water += vec3(1.0,0.75,0.45) * pow(sunSpec,90.0) * 1.6;
        water += vec3(1.0,0.95,0.8) * pow(sunSpec,700.0) * 2.0;

        float grain = hash(floor(p*80.0));
        vec3 dry = vec3(0.96,0.85,0.66) * (0.94 + 0.06*grain);
        float wet = exp(-max(dz,0.0)*1.4);
        vec3 sand = mix(dry, vec3(0.66,0.54,0.40), wet*0.85);

        vec3 col = mix(water, sand, smoothstep(-0.04,0.04,dz));

        float foamLine = exp(-abs(dz-0.08)*16.0) * (0.55 + 0.45*vnoise(p*5.0 + t*0.7));
        float foamSea  = smoothstep(-1.0,0.0,dz) * (1.0 - step(0.0,dz))
                       * (0.25 + 0.5*vnoise(p*7.0 - t*0.6));
        float foam = clamp(foamLine + foamSea, 0.0, 1.0);
        col = mix(col, vec3(1.0,0.97,0.92), foam*0.9);

        gl_FragColor = vec4(col,1.0);
      }`
  });
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), groundMat);
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  /* ---------- 조명 ---------- */
  scene.add(new THREE.HemisphereLight(0xffe6cc, 0x6b8fb0, 0.75));
  const sunLight = new THREE.DirectionalLight(0xffc89a, 1.0);
  sunLight.position.copy(SUN_DIR).multiplyScalar(30);
  scene.add(sunLight);

  /* ---------- 지구 ---------- */
  const earthGroup = new THREE.Group();
  earthGroup.position.set(0, 3.4, -4);
  scene.add(earthGroup);

  function makeEarthTexture() {
    const W = 1024, H = 512;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');

    const sea = g.createLinearGradient(0, 0, 0, H);
    sea.addColorStop(0, '#1c4f8c');
    sea.addColorStop(0.5, '#2b7fb8');
    sea.addColorStop(1, '#1c4f8c');
    g.fillStyle = sea;
    g.fillRect(0, 0, W, H);

    let seed = 20240601;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    const cols = ['#5e9b45', '#79b153', '#4f8a3a', '#b9a86a', '#a7895a'];

    for (let i = 0; i < 90; i++) {
      const cx = rnd() * W, cy = (0.12 + rnd() * 0.76) * H;
      const rx = 18 + rnd() * 80, ry = 10 + rnd() * 40, rot = rnd() * Math.PI;
      g.fillStyle = cols[i % cols.length];
      for (const dx of [-W, 0, W]) {
        g.beginPath();
        g.ellipse(cx + dx, cy, rx, ry, rot, 0, Math.PI * 2);
        g.fill();
      }
    }

    g.fillStyle = 'rgba(240,248,255,0.95)';
    g.fillRect(0, 0, W, 22);
    g.fillRect(0, H - 22, W, 22);

    g.fillStyle = 'rgba(255,255,255,0.55)';
    for (let i = 0; i < 60; i++) {
      const cx = rnd() * W, cy = rnd() * H;
      for (const dx of [-W, 0, W]) {
        g.beginPath();
        g.ellipse(cx + dx, cy, 30 + rnd() * 50, 8 + rnd() * 12, 0, 0, Math.PI * 2);
        g.fill();
      }
    }

    const data = g.getImageData(0, 0, W, H).data;
    const mask = new Uint8Array(W * H);
    for (let i = 0; i < W * H; i++) mask[i] = data[i * 4 + 2] < 120 ? 1 : 0;

    const tex = new THREE.CanvasTexture(c);
    tex.anisotropy = 4;
    return { tex, mask, W, H };
  }

  const { tex, mask, W, H } = makeEarthTexture();
  const earth = new THREE.Mesh(
    new THREE.SphereGeometry(R, 72, 48),
    new THREE.MeshPhongMaterial({ map: tex, shininess: 14, specular: 0x333333 })
  );
  earthGroup.add(earth);
  earthGroup.add(new THREE.Mesh(
    new THREE.SphereGeometry(R * 1.06, 48, 32),
    new THREE.MeshBasicMaterial({ color: 0xffd0a0, transparent: true, opacity: 0.18, side: THREE.BackSide, depthWrite: false })
  ));

  /* ---------- 공통 유틸 ---------- */
  function randomUnit() {
    const u = Math.random() * 2 - 1, t = Math.random() * Math.PI * 2, s = Math.sqrt(1 - u * u);
    return new THREE.Vector3(s * Math.cos(t), u, s * Math.sin(t));
  }

  function landAt(n) {
    let u = Math.atan2(n.z, -n.x) / (Math.PI * 2);
    if (u < 0) u += 1;
    const v = Math.acos(Math.max(-1, Math.min(1, n.y))) / Math.PI;
    const col = Math.min(W - 1, Math.floor(u * W));
    const row = Math.min(H - 1, Math.floor(v * H));
    return mask[row * W + col] === 1;
  }

  function randomLandUnit() {
    for (let i = 0; i < 4000; i++) {
      const n = randomUnit();
      if (landAt(n)) return n;
    }
    return randomUnit();
  }

  function frame(n, h) {
    const a = Math.abs(n.y) < 0.9 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
    const e1 = new THREE.Vector3().crossVectors(a, n).normalize();
    const e2 = new THREE.Vector3().crossVectors(n, e1).normalize();
    const fwd = e1.clone().multiplyScalar(Math.cos(h)).addScaledVector(e2, Math.sin(h));
    return { e1, e2, fwd };
  }

  function place(obj, n, h, lift = 0) {
    const fr = frame(n, h);
    obj.position.copy(n).multiplyScalar(R + lift);
    const right = new THREE.Vector3().crossVectors(n, fr.fwd);
    obj.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(right, n, fr.fwd));
  }

  const lam = (color) => new THREE.MeshLambertMaterial({ color });
  const M = (geo, mat, p = [0, 0, 0], s = [1, 1, 1]) => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(...p);
    m.scale.set(...s);
    return m;
  };
  const legGeometry = (r, len) => new THREE.CylinderGeometry(r, r, len, 8).translate(0, -len / 2, 0);

  /* ---------- 꽃 ---------- */
  const petalColors = [0xff6fa8, 0xffd23f, 0xffffff, 0xff8c42, 0xb388ff, 0xff4d6d];
  const stemMat = lam(0x3f8f3a), centerMat = lam(0xffb300);
  function makeFlower() {
    const g = new THREE.Group();
    g.add(M(new THREE.CylinderGeometry(0.006, 0.008, 0.12, 6), stemMat, [0, 0.06, 0]));
    const petalMat = lam(petalColors[Math.floor(Math.random() * petalColors.length)]);
    const petalGeo = new THREE.SphereGeometry(0.02, 8, 6);
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2;
      g.add(M(petalGeo, petalMat, [Math.cos(a) * 0.018, 0.125, Math.sin(a) * 0.018], [1, 0.5, 1]));
    }
    g.add(M(new THREE.SphereGeometry(0.012, 8, 6), centerMat, [0, 0.125, 0]));
    return g;
  }
  for (let i = 0; i < 70; i++) {
    const f = makeFlower();
    place(f, randomLandUnit(), Math.random() * Math.PI * 2);
    earthGroup.add(f);
  }

  /* ---------- 어린 왕자 ---------- */
  function buildPrince() {
    const g = new THREE.Group();
    const skin = lam(0xffd9b5), hair = lam(0xf5c542), tunic = lam(0x8fc9f0);
    const pants = lam(0x3d6fb6), scarf = lam(0xe53935), black = lam(0x222222);

    const legs = [-0.03, 0.03].map(x => {
      const pv = new THREE.Group();
      pv.position.set(x, 0.1, 0);
      pv.add(M(legGeometry(0.018, 0.1), pants));
      g.add(pv);
      return pv;
    });

    g.add(M(new THREE.CylinderGeometry(0.05, 0.065, 0.13, 12), tunic, [0, 0.165, 0]));
    g.add(M(new THREE.SphereGeometry(0.058, 16, 12), skin, [0, 0.3, 0]));
    g.add(M(new THREE.SphereGeometry(0.062, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.6), hair, [0, 0.3, 0]));
    g.add(M(new THREE.SphereGeometry(0.008, 8, 6), black, [-0.022, 0.305, 0.05]));
    g.add(M(new THREE.SphereGeometry(0.008, 8, 6), black, [0.022, 0.305, 0.05]));

    const scarfRing = M(new THREE.TorusGeometry(0.05, 0.017, 8, 16), scarf, [0, 0.23, 0]);
    scarfRing.rotation.x = Math.PI / 2;
    g.add(scarfRing);
    g.add(M(new THREE.BoxGeometry(0.03, 0.09, 0.02), scarf, [0.02, 0.19, -0.06]));

    const arms = [-0.07, 0.07].map(x => {
      const pv = new THREE.Group();
      pv.position.set(x, 0.21, 0);
      pv.add(M(legGeometry(0.014, 0.13), tunic));
      pv.add(M(new THREE.SphereGeometry(0.018, 8, 6), skin, [0, -0.135, 0]));
      g.add(pv);
      return pv;
    });

    return { obj: g, legs, legOff: [0, Math.PI], arms, armOff: [Math.PI, 0], tail: null, tailAxis: 'z' };
  }

  /* ---------- 강아지 ---------- */
  function buildDog() {
    const g = new THREE.Group();
    const fur = lam(0xc58b4c), dark = lam(0x6e4526), cream = lam(0xfff2dc), black = lam(0x1d1d1d), pink = lam(0xff8fa3);

    g.add(M(new THREE.SphereGeometry(0.09, 16, 12), fur, [0, 0.12, 0], [0.9, 0.8, 1.6]));
    g.add(M(new THREE.SphereGeometry(0.07, 16, 12), fur, [0, 0.2, 0.13]));
    g.add(M(new THREE.SphereGeometry(0.035, 12, 10), cream, [0, 0.185, 0.2], [1, 0.8, 1.2]));
    g.add(M(new THREE.SphereGeometry(0.014, 8, 6), black, [0, 0.19, 0.235]));
    g.add(M(new THREE.SphereGeometry(0.03, 10, 8), dark, [-0.05, 0.25, 0.12], [0.6, 1.4, 0.4]));
    g.add(M(new THREE.SphereGeometry(0.03, 10, 8), dark, [0.05, 0.25, 0.12], [0.6, 1.4, 0.4]));
    g.add(M(new THREE.SphereGeometry(0.011, 8, 6), black, [-0.028, 0.22, 0.19]));
    g.add(M(new THREE.SphereGeometry(0.011, 8, 6), black, [0.028, 0.22, 0.19]));
    g.add(M(new THREE.SphereGeometry(0.008, 8, 6), pink, [0, 0.2, 0.25]));

    const legGeo = legGeometry(0.022, 0.1);
    const legs = [[-0.05, 0.09], [0.05, 0.09], [-0.05, -0.08], [0.05, -0.08]].map(([x, z]) => {
      const pv = new THREE.Group();
      pv.position.set(x, 0.1, z);
      pv.add(M(legGeo, dark));
      g.add(pv);
      return pv;
    });

    const tail = new THREE.Group();
    tail.position.set(0, 0.16, -0.16);
    tail.rotation.x = -0.9;
    tail.add(M(new THREE.CylinderGeometry(0.018, 0.012, 0.14, 6).translate(0, 0.07, 0), fur));
    g.add(tail);

    return { obj: g, legs, legOff: [0, Math.PI, Math.PI, 0], arms: [], armOff: [], tail, tailAxis: 'z' };
  }

  /* ---------- 고양이 ---------- */
  function buildCat() {
    const g = new THREE.Group();
    const fur = lam(0x9aa6b5), belly = lam(0xf4efe6), eye = lam(0x7bd389), pink = lam(0xff9eb0);

    g.add(M(new THREE.SphereGeometry(0.085, 16, 12), fur, [0, 0.12, 0], [0.9, 0.85, 1.5]));
    g.add(M(new THREE.SphereGeometry(0.05, 12, 10), belly, [0, 0.1, 0.04], [0.9, 0.8, 1.3]));
    g.add(M(new THREE.SphereGeometry(0.065, 16, 12), fur, [0, 0.2, 0.12]));
    g.add(M(new THREE.ConeGeometry(0.026, 0.05, 4), fur, [-0.04, 0.27, 0.12]));
    g.add(M(new THREE.ConeGeometry(0.026, 0.05, 4), fur, [0.04, 0.27, 0.12]));
    g.add(M(new THREE.SphereGeometry(0.013, 8, 6), eye, [-0.024, 0.215, 0.18]));
    g.add(M(new THREE.SphereGeometry(0.013, 8, 6), eye, [0.024, 0.215, 0.18]));
    g.add(M(new THREE.SphereGeometry(0.008, 8, 6), pink, [0, 0.2, 0.19]));

    const legGeo = legGeometry(0.02, 0.09);
    const legs = [[-0.045, 0.08], [0.045, 0.08], [-0.045, -0.07], [0.045, -0.07]].map(([x, z]) => {
      const pv = new THREE.Group();
      pv.position.set(x, 0.09, z);
      pv.add(M(legGeo, fur));
      g.add(pv);
      return pv;
    });

    const tailPivot = new THREE.Group();
    tailPivot.position.set(0, 0.12, -0.14);
    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(0, 0.03, -0.08),
      new THREE.Vector3(0, 0.12, -0.14),
      new THREE.Vector3(0, 0.22, -0.12)
    ]);
    tailPivot.add(M(new THREE.TubeGeometry(curve, 12, 0.014, 6, false), fur));
    g.add(tailPivot);

    return { obj: g, legs, legOff: [0, Math.PI, Math.PI, 0], arms: [], armOff: [], tail: tailPivot, tailAxis: 'y' };
  }

  /* ---------- 엔티티 생성 ---------- */
  function makeEntity(parts, isPrince, baseSpeed) {
    const ent = Object.assign({
      isPrince, baseSpeed,
      n: randomUnit(),
      h: Math.random() * Math.PI * 2,
      speed: 0, walking: true, timer: Math.random() * 2,
      chase: false, phase: Math.random() * 6, lift: 0
    }, parts);
    ent.obj.scale.setScalar(isPrince ? 1.2 : 1.25);
    earthGroup.add(ent.obj);
    return ent;
  }

  const prince = makeEntity(buildPrince(), true, 0.55);
  prince.n = randomLandUnit();
  const dog = makeEntity(buildDog(), false, 0.45);
  const cat = makeEntity(buildCat(), false, 0.45);
  dog.n = prince.n.clone().add(randomUnit().multiplyScalar(0.2)).normalize();
  cat.n = prince.n.clone().add(randomUnit().multiplyScalar(0.2)).normalize();

  /* ---------- AI 행동 ---------- */
  function headingTo(ent, target) {
    const fr = frame(ent.n, 0);
    const d = new THREE.Vector3().copy(target).sub(ent.n);
    return Math.atan2(d.dot(fr.e2), d.dot(fr.e1));
  }

  function aiUpdate(ent, dt) {
    ent.timer -= dt;
    if (ent.timer <= 0) {
      ent.timer = 2 + Math.random() * 3;
      ent.walking = Math.random() < 0.75;
      ent.chase = !ent.isPrince && Math.random() < 0.4;
      if (ent.chase) ent.timer = 4 + Math.random() * 3;
      else ent.h += (Math.random() * 2 - 1) * 2.2;
    }
    if (ent.chase) {
      ent.h = headingTo(ent, prince.n);
      ent.walking = ent.n.dot(prince.n) < 0.996;
    }
    ent.speed = ent.walking ? ent.baseSpeed : 0;
  }

  /* ---------- 입력: 방향키 / 화면 버튼 / 드래그 ---------- */
  const keys = {};
  let lastInput = -1e9;
  let aiOn = true;
  const aiBtn = document.getElementById('btnAI');
  aiBtn.addEventListener('click', () => {
    aiOn = !aiOn;
    aiBtn.classList.toggle('active', aiOn);
    aiBtn.textContent = aiOn ? '🤖 AI 모드 켜짐' : '🕹️ 직접 조작 중';
  });

  const isTyping = el => el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA');
  window.addEventListener('keydown', e => {
    if (!e.key.startsWith('Arrow') || isTyping(e.target)) return;
    e.preventDefault();
    keys[e.key] = true;
  });
  window.addEventListener('keyup', e => { if (e.key.startsWith('Arrow')) keys[e.key] = false; });

  document.querySelectorAll('.pad button').forEach(b => {
    const k = b.dataset.key;
    b.addEventListener('pointerdown', e => { e.preventDefault(); keys[k] = true; });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => { keys[k] = false; }));
  });

  let dragging = false, lastX = 0;
  canvas.addEventListener('pointerdown', e => {
    dragging = true; lastX = e.clientX;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    if (!dragging) return;
    earthGroup.rotation.y += (e.clientX - lastX) * 0.006;
    lastX = e.clientX;
  });
  ['pointerup', 'pointercancel'].forEach(ev => canvas.addEventListener(ev, () => { dragging = false; }));

  function update(dt) {
    const held = k => !!keys[k];
    const now = performance.now();
    const anyHeld = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].some(held);
    if (anyHeld) lastInput = now;
    const manual = now - lastInput < 3000;

    if (manual) {
      if (held('ArrowLeft')) prince.h -= 2.4 * dt;
      if (held('ArrowRight')) prince.h += 2.4 * dt;
      prince.speed = held('ArrowUp') ? 0.55 : held('ArrowDown') ? -0.4 : 0;
    } else if (aiOn) {
      aiUpdate(prince, dt);
    } else {
      prince.speed = 0;
    }

    if (aiOn) {
      aiUpdate(dog, dt);
      aiUpdate(cat, dt);
    } else {
      dog.speed = 0;
      cat.speed = 0;
    }
  }

  function step(ent, dt) {
    const f = frame(ent.n, ent.h).fwd;
    ent.n.addScaledVector(f, ent.speed * dt).normalize();
  }

  function animate(ent, dt, t) {
    const moving = ent.speed !== 0;
    if (moving) {
      step(ent, dt);
      ent.phase += dt * Math.abs(ent.speed) * 16;
    }
    const sw = moving ? 1 : 0;
    ent.lift = sw * Math.abs(Math.sin(ent.phase)) * 0.015;
    place(ent.obj, ent.n, ent.h, ent.lift);

    ent.legs.forEach((l, i) => { l.rotation.x = Math.sin(ent.phase + ent.legOff[i]) * 0.6 * sw; });
    ent.arms.forEach((a, i) => { a.rotation.x = Math.sin(ent.phase + ent.armOff[i]) * 0.5 * sw; });
    if (ent.tail) {
      const wag = ent.tailAxis === 'z' ? Math.sin(t * 9) * 0.4 : Math.sin(t * 3 + ent.phase) * 0.4;
      ent.tail.rotation[ent.tailAxis] = wag;
    }
  }

  /* ---------- 크기 / 반응형 ---------- */
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.position.set(0, 4.4, 15 + Math.max(0, 1.1 - camera.aspect) * 12);
    camera.lookAt(lookTarget);
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage);
  window.addEventListener('resize', resize);
  resize();

  /* ---------- 루프 ---------- */
  const clock = new THREE.Clock();
  function loop() {
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;

    groundMat.uniforms.uTime.value = t;
    groundMat.uniforms.uCam.value.copy(camera.position);
    if (!dragging) earthGroup.rotation.y += dt * 0.02;

    update(dt);
    animate(prince, dt, t);
    animate(dog, dt, t);
    animate(cat, dt, t);

    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
